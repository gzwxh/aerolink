<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-labelledby="title desc">
  <!--
    鸢联 AeroLink 项目 LOGO（自研矢量素材）。

    造型：「一大三小」四片同族叶片。右侧大叶片由一道轮廓加一条主脉、四条支脉与六个节点
    构成，主脉与支脉交汇在叶根的发光节点上；左侧三片小叶片用同一套语言（外缘凸、内缘平，
    收出尖头；一条中脉 + 一个端点小节点），沿大叶片的内侧折边等距排成一列，叶尖朝外、
    叶柄贴着折边。小叶片是「鸢」，脉与节点是「Link」。叶片之间都留有空隙，互不叠压；
    全部为几何图形，不含文字，不依赖任何字体与外部资源。

    透明底（重要）：刻意不画底板 / 圆角方块。它要同时出现在浅色与深色界面
    （侧边栏、登录页、文档）上，带底色会在浅色界面里显得突兀。配色取中间调的
    饱和蓝，两种背景上都能读清；需要「深蓝底发光」效果时由使用方自己铺底。

    动效契约（与 ui/src/assets/login-banner.svg 同源，改图前两份一起看）：
    - 全部为 SVG SMIL，只在图像上下文（<img> / 内联 SVG）里播放；CSS
      background-image 与 favicon 会按静态帧渲染，别把它当背景图或站点图标用。
    - 周期：整叶浮动与开合 3.4s，沿脉流动的信号 2.4 ~ 3.2s，节点呼吸 3.2s，
      轮廓上的高光扫过 7s。位移都压在 2 个单位（128 画布）以内。
    - 只做位移 / 旋转 / 描边流动，不改变任何静态几何与配色；不支持 SMIL 的渲染器
      显示第 0 帧（脉冲环不可见、轮廓高光只在翼尖一小段），与静态图基本一致。
  -->
  <title id="title">鸢联 AeroLink</title>
  <desc id="desc">一大三小四片同族叶片：大叶片里有一条主脉与四条支脉，交汇处是发光的节点；三片小叶片贴在同一侧，叶脉上有信号流动，节点微微呼吸</desc>

  <defs>
    <linearGradient id="leafTop" x1="0%" y1="0%" x2="60%" y2="100%">
      <stop offset="0%" stop-color="#45C0FF" />
      <stop offset="100%" stop-color="#0C56E0" />
    </linearGradient>
    <linearGradient id="leafMid" x1="0%" y1="0%" x2="60%" y2="100%">
      <stop offset="0%" stop-color="#2E9CF5" />
      <stop offset="100%" stop-color="#0A49C8" />
    </linearGradient>
    <linearGradient id="leafLow" x1="0%" y1="0%" x2="60%" y2="100%">
      <stop offset="0%" stop-color="#1C78E8" />
      <stop offset="100%" stop-color="#0838A8" />
    </linearGradient>
    <linearGradient id="lobeEdge" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#48CFF7" />
      <stop offset="100%" stop-color="#0C86D6" />
    </linearGradient>
    <radialGradient id="lobeFill" cx="45%" cy="85%" r="70%">
      <stop offset="0%" stop-color="#1E86E0" stop-opacity="0.14" />
      <stop offset="100%" stop-color="#1E86E0" stop-opacity="0.01" />
    </radialGradient>
    <radialGradient id="hubBloom">
      <stop offset="0%" stop-color="#4FD8FF" stop-opacity="0.6" />
      <stop offset="55%" stop-color="#2AA6F0" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#1E86E0" stop-opacity="0" />
    </radialGradient>
    <filter id="markGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- 整翼：浮动 + 绕翼根开合（同一 3.4s 周期） -->
  <g transform="translate(-4 2)">
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1.6;0 0" dur="3.4s" repeatCount="indefinite" additive="sum" />
    <g>
      <animateTransform attributeName="transform" type="rotate" values="0 58.4 92.2;1.1 58.4 92.2;0 58.4 92.2;-0.8 58.4 92.2;0 58.4 92.2" dur="3.4s" repeatCount="indefinite" />

      <g filter="url(#markGlow)">

        <!-- 左侧三片小叶片：与翼面同一套语言（外缘凸、内缘平，收出尖头；中脉 + 端点小节点），
             沿翼面内侧折边等距排成一列：叶尖朝外、叶柄贴近折边（净距 6~11 单位，不叠压），
             与右侧叶片组成「一大三小」的同族关系 -->
        <g>
          <g transform="translate(37.7 23) rotate(39.7) scale(0.82)">
            <animate attributeName="opacity" values="0.88;1;0.88" dur="3.6s" repeatCount="indefinite" />
            <animateTransform attributeName="transform" type="translate" values="0 0;-0.8 -0.8;0 0" dur="3.6s" repeatCount="indefinite" additive="sum" />
            <path d="M0 0 C 16 10 34 10 50 0 C 34 -6 16 -6 0 0 Z" fill="url(#leafTop)" fill-opacity="0.72" stroke="url(#leafTop)" stroke-width="2.32" stroke-linejoin="round" />
            <path d="M0 0 C 16 3.4 34 4 47 1.4" fill="none" stroke="#9FE8FF" stroke-width="1.22" stroke-linecap="round" opacity="0.85" />
            <circle cx="44" cy="2.6" r="2.68" fill="#BFF1FF" />
          </g>
          <g transform="translate(27.2 42.4) rotate(40.1) scale(0.68)">
            <animate attributeName="opacity" values="0.88;1;0.88" dur="3.6s" begin="-1.2s" repeatCount="indefinite" />
            <animateTransform attributeName="transform" type="translate" values="0 0;-0.8 -0.8;0 0" dur="3.6s" begin="-1.2s" repeatCount="indefinite" additive="sum" />
            <path d="M0 0 C 16 10 34 10 50 0 C 34 -6 16 -6 0 0 Z" fill="url(#leafMid)" fill-opacity="0.72" stroke="url(#leafMid)" stroke-width="2.79" stroke-linejoin="round" />
            <path d="M0 0 C 16 3.4 34 4 47 1.4" fill="none" stroke="#9FE8FF" stroke-width="1.47" stroke-linecap="round" opacity="0.85" />
            <circle cx="44" cy="2.6" r="3.24" fill="#BFF1FF" />
          </g>
          <g transform="translate(18 60.2) rotate(45.3) scale(0.54)">
            <animate attributeName="opacity" values="0.88;1;0.88" dur="3.6s" begin="-2.4s" repeatCount="indefinite" />
            <animateTransform attributeName="transform" type="translate" values="0 0;-0.8 -0.8;0 0" dur="3.6s" begin="-2.4s" repeatCount="indefinite" additive="sum" />
            <path d="M0 0 C 16 10 34 10 50 0 C 34 -6 16 -6 0 0 Z" fill="url(#leafLow)" fill-opacity="0.72" stroke="url(#leafLow)" stroke-width="3.52" stroke-linejoin="round" />
            <path d="M0 0 C 16 3.4 34 4 47 1.4" fill="none" stroke="#9FE8FF" stroke-width="1.85" stroke-linecap="round" opacity="0.85" />
            <circle cx="44" cy="2.6" r="4.07" fill="#BFF1FF" />
          </g>
        </g>

        <!-- 翼根辉光：随心跳呼吸 -->
        <ellipse cx="58.4" cy="92.2" rx="21" ry="16" fill="url(#hubBloom)">
          <animate attributeName="rx" values="19;22;19" dur="3.2s" repeatCount="indefinite" />
          <animate attributeName="opacity" values="0.85;1;0.85" dur="3.2s" repeatCount="indefinite" />
        </ellipse>

        <!-- 翼面：下缘一道长弧（翼缘），内侧一条折边（翼根处近乎竖直），收出细长的翼尖 -->
        <path d="M118 17.5 C 121 23 121.5 40 121 50 C 120 66 113 83 98 94 C 90 99.5 82 102 74 103 C 62 105 48 105 38.9 108.9 C 44 100 47 89 52 80 C 60 67 72 56 90 46 C 97 41 108 33 118 17.5 Z" fill="url(#lobeFill)" />
        <path d="M118 17.5 C 121 23 121.5 40 121 50 C 120 66 113 83 98 94 C 90 99.5 82 102 74 103 C 62 105 48 105 38.9 108.9 C 44 100 47 89 52 80 C 60 67 72 56 90 46 C 97 41 108 33 118 17.5 Z" fill="none" stroke="url(#lobeEdge)" stroke-width="1.9" stroke-linejoin="round" />

        <!-- 翼脉：主脉（翼根 → 翼尖）+ 四条支脉，交汇处落在节点上 -->
        <g fill="none" stroke="#28B4EE" stroke-width="1.05" stroke-linecap="round" opacity="0.9">
          <path d="M58.4 92.2 C 70 80 82 58 90.2 44.2 C 98 33 110 23 118 17.5" />
          <path d="M84.9 53.3 C 97 51 110 49 121 47.5" />
          <path d="M76.2 70.1 C 87 72 99 76 107 83" />
          <path d="M58.4 92.2 C 63 96 67 99 71 103" />
          <path d="M58.4 92.2 C 56 92 52 91 48.6 90" />
        </g>

        <!-- 节点：错开呼吸 -->
        <g fill="#6FE3FF">
          <circle cx="84.9" cy="53.3" r="2.6">
            <animate attributeName="opacity" values="0.62;1;0.62" dur="3.2s" repeatCount="indefinite" />
          </circle>
          <circle cx="102.4" cy="30.1" r="2.4">
            <animate attributeName="opacity" values="0.62;1;0.62" dur="3.2s" begin="-1.6s" repeatCount="indefinite" />
          </circle>
          <circle cx="76.2" cy="70.1" r="2.2">
            <animate attributeName="opacity" values="0.62;1;0.62" dur="3.2s" begin="-1.1s" repeatCount="indefinite" />
          </circle>
          <circle cx="110.6" cy="49" r="2.2">
            <animate attributeName="opacity" values="0.62;1;0.62" dur="3.2s" begin="-1.9s" repeatCount="indefinite" />
          </circle>
          <circle cx="107" cy="83" r="2.2">
            <animate attributeName="opacity" values="0.62;1;0.62" dur="3.2s" begin="-2.6s" repeatCount="indefinite" />
          </circle>
          <circle cx="65.5" cy="97.9" r="2.2">
            <animate attributeName="opacity" values="0.62;1;0.62" dur="3.2s" begin="-0.6s" repeatCount="indefinite" />
          </circle>
        </g>

        <!-- 翼脉上流动的信号：沿主脉与两条支脉向外跑 -->
        <g fill="#CFF6FF">
          <circle r="1.5">
            <animateMotion dur="2.8s" repeatCount="indefinite" path="M58.4 92.2 C 70 80 82 58 90.2 44.2 C 98 33 110 23 118 17.5" />
          </circle>
          <circle r="1.3">
            <animateMotion dur="3.2s" begin="-1.4s" repeatCount="indefinite" path="M84.9 53.3 C 97 51 110 49 121 47.5" />
          </circle>
          <circle r="1.3">
            <animateMotion dur="2.4s" begin="-0.9s" repeatCount="indefinite" path="M58.4 92.2 C 63 96 67 99 71 103" />
          </circle>
        </g>

        <!-- 翼根节点：心跳脉冲 + 芯点 -->
        <circle cx="58.4" cy="92.2" r="3.4" fill="none" stroke="#8FEBFF" stroke-width="1.2" opacity="0">
          <animate attributeName="r" values="3.4;16" dur="3.2s" repeatCount="indefinite" />
          <animate attributeName="opacity" values="0.6;0" dur="3.2s" repeatCount="indefinite" />
        </circle>
        <circle cx="58.4" cy="92.2" r="3.9" fill="#1FBEF0">
          <animate attributeName="opacity" values="0.85;1;0.85" dur="3.2s" repeatCount="indefinite" />
        </circle>
        <circle cx="58.4" cy="92.2" r="1.7" fill="#EAFEFF" />

        <!-- 轮廓高光：一道亮弧沿翼缘缓慢扫过 -->
        <path d="M118 17.5 C 121 23 121.5 40 121 50 C 120 66 113 83 98 94 C 90 99.5 82 102 74 103 C 62 105 48 105 38.9 108.9 C 44 100 47 89 52 80 C 60 67 72 56 90 46 C 97 41 108 33 118 17.5 Z" fill="none" stroke="#D8F8FF" stroke-width="2.4" stroke-linecap="round" stroke-dasharray="16 244" opacity="0.85">
          <animate attributeName="stroke-dashoffset" values="260;0" dur="7s" repeatCount="indefinite" />
        </path>

      </g>
    </g>
  </g>
</svg>
