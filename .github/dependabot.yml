# Dependabot 版本更新配置：需要指定要更新的包生态系统（package ecosystem）
# 以及各清单文件所在目录。所有可配置项见官方文档：
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/ui/"
    schedule:
      interval: "weekly"
    groups:
      fe-deps:
        patterns:
          - "*"
        exclude-patterns:
          - "monaco-editor"
          - "recharts"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      go-deps:
        patterns:
          - "*"
