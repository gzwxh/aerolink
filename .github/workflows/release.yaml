name: Release

on:
  push:
    tags:
      - 'v[0-9]+\.[0-9]+\.[0-9]+'

# 本仓库（内部二开）也能用这条流水线：原来的门禁写死
# `github.repository_owner == 'kite-org'`，导致本仓库恒不执行，看起来有 CI/CD 实际全靠手工发布。
# 现在改成"仓库变量开关 + 目标仓库可配置"：
#
#   vars.RELEASE_ENABLED        必须显式设为 true 才会跑（默认不跑，避免误触发发布）
#   vars.IMAGE_REPOSITORY       目标镜像，默认与 charts/kite/values.yaml 的 image.repository 一致
#                               例：swr.cn-south-1.myhuaweicloud.com/dsy/devops/kite / ghcr.io/<owner>/kite
#   vars.CHART_OCI_REPOSITORY   Helm chart 的 OCI 目标，留空则不推送 chart
#                               例：oci://swr.cn-south-1.myhuaweicloud.com/dsy/devops/charts
#   vars.HELM_INDEX_ENABLED     是否更新 gh-pages 上的 Helm index（上游分发用，本仓库默认关）
#   secrets.IMAGE_REGISTRY_USERNAME / IMAGE_REGISTRY_PASSWORD
#                               非 ghcr.io 目标仓库的推送凭据（ghcr.io 用 GITHUB_TOKEN）
#
# 镜像 host 由 IMAGE_REPOSITORY 首段推导：带点或带端口的是 registry，否则按 Docker Hub 处理。

env:
  IMAGE_NAME: kite
  GO_VERSION: "1.26"
  NODE_VERSION: "24"
  IMAGE_REPOSITORY: ${{ vars.IMAGE_REPOSITORY || 'swr.cn-south-1.myhuaweicloud.com/dsy/devops/kite' }}
  CHART_OCI_REPOSITORY: ${{ vars.CHART_OCI_REPOSITORY }}

jobs:
  # 开关没打开时，让 tag 推送产出一个绿色的、有说明的运行记录，
  # 而不是静默跳过（避免又变回「看起来有 CI/CD，实际不执行」）。
  disabled-notice:
    runs-on: ubuntu-latest
    if: ${{ vars.RELEASE_ENABLED != 'true' }}
    steps:
      - name: Explain why nothing was built
        run: |
          echo "::notice::Release workflow is disabled: repository variable RELEASE_ENABLED is not 'true'. See docs/dev/release-checklist.md §2."

  push:
    runs-on: ubuntu-latest
    if: ${{ vars.RELEASE_ENABLED == 'true' }}
    permissions:
      packages: write
      contents: write
    outputs:
      tag_name: ${{ steps.check_version.outputs.tag_name }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          # 生成发布说明要遍历 tag（scripts/changelog.sh），浅克隆拿不到。
          fetch-depth: 0

      - name: Resolve image coordinates
        id: image
        run: |
          REPOSITORY="${{ env.IMAGE_REPOSITORY }}"
          FIRST="${REPOSITORY%%/*}"
          case "$FIRST" in
            # registry host 一定带点（域名）或端口；localhost 是本地调试的特例。
            *.*|*:*|localhost) REGISTRY="$FIRST" ;;
            # 形如 zzde/kite：没有 host，按 Docker Hub 处理。
            *) REGISTRY="docker.io" ;;
          esac
          echo "registry=$REGISTRY" >> "$GITHUB_OUTPUT"
          echo "Pushing image to $REPOSITORY (registry: $REGISTRY)"

      - name: Login to GitHub Container Registry
        if: steps.image.outputs.registry == 'ghcr.io'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        if: steps.image.outputs.registry == 'docker.io'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.IMAGE_REGISTRY_USERNAME }}
          password: ${{ secrets.IMAGE_REGISTRY_PASSWORD }}

      - name: Login to image registry
        if: steps.image.outputs.registry != 'ghcr.io' && steps.image.outputs.registry != 'docker.io'
        uses: docker/login-action@v4
        with:
          registry: ${{ steps.image.outputs.registry }}
          username: ${{ secrets.IMAGE_REGISTRY_USERNAME }}
          password: ${{ secrets.IMAGE_REGISTRY_PASSWORD }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"
          cache-dependency-path: ui/pnpm-lock.yaml

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          check-latest: true

      - name: Install deps
        run: make deps

      - name: Check version
        id: check_version
        run: |
          TAG_NAME=${GITHUB_REF#refs/tags/}
          echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT

      - name: Build
        # 用 tag 覆盖 Makefile 里的默认 VERSION：产物版本与 tag 始终一致，
        # 发布后核对 /api/v1/version 才有意义（见 docs/dev/release-checklist.md）。
        run: make cross-compile VERSION=${{ steps.check_version.outputs.tag_name }}

      - name: Package binaries
        run: make package-binaries

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile.binary
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.IMAGE_REPOSITORY }}:${{ steps.check_version.outputs.tag_name }}
            ${{ env.IMAGE_REPOSITORY }}:latest
          labels: runnumber=${{ github.run_id }}

      - name: Generate release notes
        run: |
          TAG_NAME="${{ steps.check_version.outputs.tag_name }}"
          PREVIOUS_TAG=$(git tag --sort=-creatordate | grep -vx "$TAG_NAME" | head -n 1 || true)
          if [ -n "$PREVIOUS_TAG" ]; then
            echo "Release notes: $PREVIOUS_TAG..$TAG_NAME"
            sh scripts/changelog.sh --from "$PREVIOUS_TAG" --to "$TAG_NAME" > release-notes.md
          else
            echo "Release notes: full history"
            sh scripts/changelog.sh --to "$TAG_NAME" > release-notes.md
          fi
          cat release-notes.md

      - name: Package Helm chart
        run: |
          helm package charts/kite/

      - name: Login Helm to the chart registry
        if: env.CHART_OCI_REPOSITORY != ''
        run: |
          HOST="${{ env.CHART_OCI_REPOSITORY }}"
          HOST="${HOST#oci://}"
          HOST="${HOST%%/*}"
          if [ "$HOST" = "ghcr.io" ]; then
            echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login "$HOST" -u "${{ github.actor }}" --password-stdin
          else
            echo "${{ secrets.IMAGE_REGISTRY_PASSWORD }}" | helm registry login "$HOST" -u "${{ secrets.IMAGE_REGISTRY_USERNAME }}" --password-stdin
          fi

      - name: Push Helm chart to OCI registry
        if: env.CHART_OCI_REPOSITORY != ''
        run: |
          CHART_PACKAGE=$(ls kite-*.tgz)
          helm push "$CHART_PACKAGE" "${{ env.CHART_OCI_REPOSITORY }}"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.check_version.outputs.tag_name }}
          name: ${{ steps.check_version.outputs.tag_name }}
          draft: false
          prerelease: false
          # 用 scripts/changelog.sh 的分类产物作正文，而不是托管平台自动汇总的 commit 列表。
          body_path: release-notes.md
          files: |
            bin/kite-*-${{ steps.check_version.outputs.tag_name }}.tar.gz
            kite-*.tgz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # 上游把 chart 通过 gh-pages 上的 Helm index 分发；本仓库用 OCI（CHART_OCI_REPOSITORY）
  # 或内网仓库，所以这个作业默认不跑，需要时用 vars.HELM_INDEX_ENABLED 打开。
  update-helm-index:
    runs-on: ubuntu-latest
    needs: push
    if: ${{ vars.RELEASE_ENABLED == 'true' && vars.HELM_INDEX_ENABLED == 'true' && startsWith(github.ref, 'refs/tags/v') }}
    permissions:
      contents: write
    steps:
      - name: Checkout gh-pages
        uses: actions/checkout@v5
        with:
          ref: gh-pages
          fetch-depth: 0

      - name: Download release assets
        run: |
          TAG_NAME=${{ needs.push.outputs.tag_name }}
          VERSION=$(echo $TAG_NAME | sed 's/^v//')

          # 从 release 里取回 helm chart
          gh release download $TAG_NAME --pattern "kite-$VERSION.tgz"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update Helm index
        run: |
          TAG_NAME=${{ needs.push.outputs.tag_name }}
          VERSION=$(echo $TAG_NAME | sed 's/^v//')

          # 设置 helm chart 的仓库地址（chart 的下载来源）
          REPO_URL="https://github.com/${{ github.repository }}/releases/download/$TAG_NAME"

          # 更新 index.yaml
          if [ -f index.yaml ]; then
            helm repo index . --url $REPO_URL --merge index.yaml
          else
            helm repo index . --url $REPO_URL
          fi

      - name: Commit and push index.yaml
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

          git add index.yaml
          if ! git diff --cached --quiet; then
            git commit -m "Update Helm index for ${{ needs.push.outputs.tag_name }}"
            git push
          else
            echo "No changes to commit"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
