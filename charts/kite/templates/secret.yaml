{{- if .Values.secret.create }}
{{- $secretName := printf "%s-secret" (include "kite.fullname" .) }}
{{- $encryptKey := .Values.encryptKey }}
{{- if not $encryptKey }}
  {{- /* Reuse the key generated by a previous release so stored secrets stay readable. */}}
  {{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName }}
  {{- if and $existing $existing.data }}
    {{- /* 优先新键名；回退旧键名 KITE_ENCRYPT_KEY 是必须的：改名前的 release 里存的是旧键，
           若只认新键会当成「没有已存在的密钥」而重新生成随机值，已加密入库的凭据将全部无法解密。 */}}
    {{- $stored := index $existing.data "AEROLINK_ENCRYPT_KEY" }}
    {{- if not $stored }}
      {{- $stored = index $existing.data "KITE_ENCRYPT_KEY" }}
    {{- end }}
    {{- if $stored }}
      {{- $encryptKey = $stored | b64dec }}
    {{- end }}
  {{- end }}
{{- end }}
{{- if not $encryptKey }}
  {{- $encryptKey = randAlphaNum 32 }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kite.labels" . | nindent 4 }}
type: Opaque
data:
  {{- if .Values.jwtSecret }}
  JWT_SECRET: {{ .Values.jwtSecret | b64enc | quote }}
  {{- end }}
  AEROLINK_ENCRYPT_KEY: {{ $encryptKey | b64enc | quote }}
  {{- if ne .Values.db.type "sqlite" }}
  DB_TYPE: {{ .Values.db.type | b64enc | quote }}
  DB_DSN: {{ .Values.db.dsn | b64enc | quote }}
  {{- end }}
{{- end }}