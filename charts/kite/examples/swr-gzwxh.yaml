# 使用「个人仓库」中的自建镜像部署 Kite：
#
#   helm upgrade --install kite charts/kite -n kite-system --create-namespace \
#     -f charts/kite/examples/swr-gzwxh.yaml \
#     --set image.tag=$(bash scripts/get-version.sh)
#
# 镜像构建与推送见 docs/guide/build-and-push-image.md。
image:
  repository: swr.cn-south-1.myhuaweicloud.com/gzwxh/devops/aerolink
  # 留空则回退到 Chart.appVersion；上面命令的 --set image.tag 已显式传入，不写死。
  tag: ""
  pullPolicy: IfNotPresent

# SWR 私有仓库需要拉取凭据时，先创建 Secret 再取消下面的注释：
#   kubectl create secret docker-registry swr-gzwxh -n kite-system \
#     --docker-server=swr.cn-south-1.myhuaweicloud.com \
#     --docker-username='cn-south-1@<AK>' \
#     --docker-password='<SK>'
# imagePullSecrets:
#   - name: swr-gzwxh

# 生产环境务必改掉默认加密密钥（用于加密密码 / OAuth clientSecret / kubeconfig）
# encryptKey: "<32 位以上随机字符串>"

# 需要域名访问时按需启用
# ingress:
#   enabled: true
#   className: nginx
#   hosts:
#     - host: kite.example.com
#       paths:
#         - path: /
#           pathType: Prefix
