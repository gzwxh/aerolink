# 使用「公司仓库」中的镜像部署 Kite：
#
#   helm upgrade --install kite charts/kite -n kite-system --create-namespace \
#     -f charts/kite/examples/swr-dsy.yaml \
#     --set image.tag=$(bash scripts/get-version.sh)
#
# 推送镜像到公司仓库需要 SWR 组织（dsy）下的账号：
#   docker --config ~/.docker-dsy login -u cn-south-1@<AK> -p <SK> swr.cn-south-1.myhuaweicloud.com
#   docker tag kite:$VERSION swr.cn-south-1.myhuaweicloud.com/dsy/kite:$VERSION
#   docker --config ~/.docker-dsy push swr.cn-south-1.myhuaweicloud.com/dsy/kite:$VERSION
image:
  repository: swr.cn-south-1.myhuaweicloud.com/dsy/kite
  tag: v0.15.1-p9-82911d0
  pullPolicy: IfNotPresent

# 组织仓库通常是私有的，需要拉取凭据：
#   kubectl create secret docker-registry swr-dsy -n kite-system \
#     --docker-server=swr.cn-south-1.myhuaweicloud.com \
#     --docker-username='cn-south-1@<AK>' \
#     --docker-password='<SK>'
imagePullSecrets:
  - name: swr-dsy

# 生产环境务必改掉默认加密密钥（用于加密密码 / OAuth clientSecret / kubeconfig）
# encryptKey: "<32 位以上随机字符串>"

# 生产环境建议开启持久化（SQLite 数据卷），并按需设置副本数为 1
# db:
#   sqlite:
#     persistence:
#       enabled: true
