# 鸢联 AeroLink 的默认配置值。
# 这是一个 YAML 格式的文件。
# 声明需要传入模板的变量。

# 设置 replicaset 数量，更多信息见：https://kubernetes.io/docs/concepts/workloads/controllers/replicaset/
replicaCount: 1

# 设置容器镜像，更多信息见：https://kubernetes.io/docs/concepts/containers/images/
image:
  repository: swr.cn-south-1.myhuaweicloud.com/gzwxh/devops/aerolink
  # 设置镜像的拉取策略。
  pullPolicy: IfNotPresent
  # 覆盖镜像 tag，其默认值为 chart 的 appVersion。
  tag:

# 设置 Deployment 的更新策略。更多信息见：https://kubernetes.io/docs/concepts/workloads/controllers/deployment/#strategy
#
# 重要：如果启用了持久化，并且在 SQLite 场景下使用
# ReadWriteOnce 的 PersistentVolumeClaim，则必须将其设置为 "Recreate"。
# 使用 "RollingUpdate" 会导致升级期间出现 pod 冲突，因为
# 多个 pod 无法同时挂载同一个 RWO 卷。
deploymentStrategy:
  type: RollingUpdate
  # rollingUpdate:
  #   maxSurge: 25%
  #   maxUnavailable: 25%

# 这是从私有仓库拉取镜像所需的 Secret，更多信息见：https://kubernetes.io/docs/tasks/configure-pod-container/pull-image-private-registry/
imagePullSecrets: []
# 用于覆盖 chart 名称。
nameOverride: ""
fullnameOverride: ""

debug: false

# 应用对外访问的 Host
# 用于生成 OAuth 重定向 URL
# 留空表示从请求头中获取
# 示例：https://aerolink.gogdev.cn
host: ""

# 应用的基础路径
# 如果要把鸢联 AeroLink 部署在子路径下，请相应地设置该值。
# 记得同时把 ingress 的路径设置为一致。
# 示例："/aerolink"
basePath: ""

# 审计/访问日志的本地归档目录（注入 AEROLINK_AUDIT_ARCHIVE_DIR）。
# 只作启动兜底：生效值在「日志审计 → 审计设置 → 归档」里配置——**数据库里的本地目录优先于本项**，
# 改了这里不会覆盖已有部署里保存过的值。
# 默认取运行用户家目录下的 data/archive，与镜像内建目录及 auditPersistence.mountPath 一致；
# 镜像本身也带同样的默认值，这里写出来只是为了显式可见、便于覆盖。置空则只依赖数据库配置。
# 注意：`auditSink: parquet` 时归档目录是**唯一落点**，既没配 localDir 又没配本项时
# 会拒绝启动（详见 docs/dev/plans/2026-09-20-审计日志parquet归档.md §12.13）。
# 另外：`replicaCount > 1` 且 sink=parquet 时，归档目录必须是**共享卷**（RWX PVC / NFS 等）——
# 每个副本只写自己产生的记录，检索要看到全部记录就得读同一个目录（见方案 §12.15d）。
#
# 审计日志的落地方式（database 默认 / parquet / elasticsearch / victorialogs / openobserve，
# 五选一互斥）由 config.yaml 的 auditSink 或 AEROLINK_AUDIT_SINK 在启动时决定，页面只读。
# 多副本部署每份副本都要写同一个值，否则记录会散到不同地方。用环境变量时：
#
#   ① parquet（配合上面的 auditArchiveDir 一起给）
#   extraEnvs:
#     - name: AEROLINK_AUDIT_SINK
#       value: parquet
#   auditArchiveDir: /home/aerolink/data/archive
#
#   ② elasticsearch（ES 地址必须先存在，否则拒绝启动：先在页面把「审计设置 → ES」
#      的地址/凭据填好保存，或走 config.enabled + config.yaml 的
#      auditArchive.elasticsearch.urls 播种）
#   extraEnvs:
#     - name: AEROLINK_AUDIT_SINK
#       value: elasticsearch
#
#   ③ victorialogs（VictoriaLogs，**不是** VictoriaMetrics；地址必须先存在，否则拒绝启动）
#   extraEnvs:
#     - name: AEROLINK_AUDIT_SINK
#       value: victorialogs
#
#   ④ openobserve（地址必须先存在，否则拒绝启动）
#   extraEnvs:
#     - name: AEROLINK_AUDIT_SINK
#       value: openobserve
#
# 或者不用环境变量，直接走 config.enabled=true + 含 config.yaml 的 Secret
# （内容里写 `auditSink: parquet`，示例见仓库根目录 config.dev.yaml）。
auditArchiveDir: /home/aerolink/data/archive

# DuckDB（parquet 检索）安装扩展的目录，注入 AEROLINK_DUCKDB_EXTENSION_DIR。
# 留空表示用进程可写的临时目录（系统临时目录下的 aerolink-duckdb-extensions）。
# 之所以要覆盖：DuckDB 默认装在 ~/.duckdb，HOME 不可写时 INSTALL httpfs 会直接失败，
# S3 归档检索随之不可用（本地 parquet 不受影响）。镜像本身已用 aerolink 用户在家目录下运行，
# HOME 可写；离线环境请在镜像里预置 httpfs 扩展，并把本项指向该目录。
duckdbExtensionDir: ""

# klog（系统日志）的落盘路径，注入 AEROLINK_LOG_FILE 环境变量：程序据此设置 -log_file
# 并关闭 stderr 输出（-logtostderr=false），即「系统日志只落文件、由采集工具收集」。
# 默认取运行用户家目录下的 data/aerolink.log（与归档共用一个卷，镜像自带同一默认值）；
# 置空表示输出到 stderr（`kubectl logs` 能直接看到系统日志）。
# 目录不存在时程序会尝试创建；实在写不进去只告警并回落到 stderr，不会让控制台起不来。
logFile: /home/aerolink/data/aerolink.log

# Pod 列表页周期推送用量（CPU/内存数字）的间隔，单位秒，注入 AEROLINK_POD_METRICS_INTERVAL。
# 留空即默认 15，与历史行为一致；调大能进一步降低推送频率，代价是数字刷新变慢。
podMetricsInterval: ""

# 单个用户在每个集群上允许并发持有的资源 watch（SSE）连接数，注入 AEROLINK_MAX_WATCH_PER_USER。
# 留空即默认 8；超限的新连接会被拒绝（429），前端自动降级为轮询。
# 设为 0 表示不限制（仅建议用于临时排查，多标签页会把连接数与推送量一起推高）。
maxWatchPerUser: ""

# 主动探活各集群 API server 的间隔（秒），注入 AEROLINK_CLUSTER_PROBE_INTERVAL。
# 留空即默认 15。不建议调大：informer 的 watch 错误回调只在出错时触发，
# 「已恢复」只能靠主动探活确认，探测越稀，陈旧提示挂得越久；设为 0 关闭探活。
clusterProbeInterval: ""

# 判「集群数据可能已过期」的阈值（秒），注入 AEROLINK_CLUSTER_STALE_AFTER。
# 留空即默认 45（探活间隔的 3 倍，容忍两轮抖动）。调小会更容易提示，
# 但也更容易在网络抖动时误报；设为 0 只保留「从未连上过」与 watch 报错两种判据。
clusterStaleAfter: ""

# 归档 parquet 与 klog 日志的持久化卷。
# 这两类文件都写在容器里，不挂卷时 Pod 重建即丢——生产建议开启（PVC 或 hostPath）。
# 挂载点默认 /home/aerolink/data（运行用户 aerolink 的家目录下）；归档目录
# /home/aerolink/data/archive 位于其下，所以 auditArchiveDir 留空时正好落在卷内。
# 注意不要把卷挂到 /home/aerolink 本身：那会把家目录里的二进制一起盖掉。
# 多副本（replicaCount > 1）时必须用 **RWX 的共享 PVC**，不能用 hostPath / emptyDir：
# 每个副本只写自己产生的审计记录，界面检索读的又是本地目录——目录不共享就查不全。
auditPersistence:
  enabled: false
  mountPath: /home/aerolink/data
  # 使用已有 PVC（留空则回退到下面的 hostPath 或 emptyDir）
  pvc:
    enabled: false
    existingClaim: ""
  hostPath:
    enabled: false
    path: /home/aerolink/data
    type: DirectoryOrCreate

# 设为 true 以启用拥有完全管理员权限的匿名用户
# 在生产环境使用该设置时请务必谨慎
anonymousUserEnabled: false

# 设为 true 后只接受密文凭据（登录口令、动态码、改密/重置口令），
# 明文提交直接 400。只在确认客户端都已升级之后再开启。
requireEncryptedCredentials: false

# 用于签名 JWT token 的密钥。留空时自动生成。
# 使用 existingSecret 时忽略该项
jwtSecret: ""

# 用于加密敏感数据的密钥。
# 留空时会在首次安装时随机生成（生成的
# 密钥通过 release 的 Secret 在升级时保留）。只有在
# 自行管理密钥时（例如使用外部密钥存储）才应在生产环境设置；
# 提交到版本控制的值等同于公钥。
# 使用 existingSecret 时忽略该项
encryptKey: ""

# Secret 处理
# 默认情况下，chart 会创建一个包含敏感值的 Kubernetes Secret。
secret:
  # 从 chart 的 values 创建 Secret（true），或引用已有的 Secret（false）
  create: true
  # 若设置，Deployment 会使用这个已有的 secret 名称而不是自动生成的名称（当 `create: true` 时忽略）。
  # 必须包含所有必需的键。
  #  JWT_SECRET
  #  AEROLINK_ENCRYPT_KEY
  #  DB_TYPE 支持的值：sqlite、postgres、mysql（未设置时默认为 sqlite）
  #  DB_DSN（sqlite 时不需要）
  # 若设置，chart 中的 db.dsn 与 db.type 值将被忽略。
  existingSecret: ""

# 数据库配置
# type: sqlite | postgres | mysql
# - sqlite：内嵌数据库（默认）。如果选择 sqlite 并希望数据在 pod 重启后仍然保留，
#   请启用下面的 persistence，这样会用 PVC 存储 sqlite 文件。
# - postgres/mysql：外部数据库的连接字段。
db:
  # 支持的值：sqlite、postgres、mysql
  type: sqlite
  # MySQL/Postgres 的完整 DSN 字符串。
  # 当 type 为 mysql/postgres 时必填
  # 当 type 不是 sqlite 时，留空表示由 existingSecret 提供
  # 示例："mysql://user:password@tcp(host:port)/dbname"
  dsn: ""
  
  # sqlite 专属选项
  sqlite:
    # 如果为 true，chart 会创建一个 PVC 并挂载到 pod 中用于存放 sqlite 数据库文件。
    # 设为 false 则使用临时存储（不推荐用于生产环境）。
    persistence:
      pvc:
        enabled: false
        existingClaim: ""
        # 为 PVC 申请的 StorageClass（可选）
        storageClass: ""
        # PVC 的 accessModes
        accessModes:
          - ReadWriteOnce
        # 申请的容量大小
        size: 1Gi
      hostPath:
        enabled: false
        path: /path/to/host/dir
        type: DirectoryOrCreate
      # 在容器内的挂载位置（运行用户 aerolink 的家目录下，与归档数据的挂载点分开）
      mountPath: /home/aerolink/db
      # mountPath 下的 sqlite 文件名
      filename: aerolink.db
    # 额外的 sqlite 数据库连接选项，会以 "/<filename>?<options>" 形式追加到 DSN。
    # 仅支持 pure-Go 驱动的 "_pragma=..." 形式；mattn 风格的
    # "_journal_mode=WAL&_busy_timeout=5000" 会被静默忽略。
    # 示例："_pragma=journal_mode(WAL)&_pragma=busy_timeout(5000)"
    options: ""
extraEnvs:
  # - name: "EXAMPLE_ENV"
  #   value: "example_value"

# 通过 values 配置应用
# 启用后，指定的配置项在界面上会变为只读。
# 你可以提供一个包含 config.yaml 键的已有 Secret，
# 也可以在下面直接内联定义配置。
config:
  enabled: false
  # 包含 `config.yaml` 键的已有 Secret 名称。
  # 设置后，下面的内联配置会被忽略。
  # 该 Secret 由用户自行创建和管理。
  # 示例：kubectl create secret generic aerolink-config --from-file=config.yaml=./my-config.yaml
  existingSecret: ""
  # --- 内联配置（existingSecret 为空时使用） ---
  # 超级用户配置（用户不存在时创建，重启时更新密码）
  # superUser:
  #   username: "admin"
  #   password: "change-me-in-production"
  # 敏感值支持 ${ENV_VAR} 占位符，启动时会从环境
  # 变量中展开。使用 extraEnvs 从 Kubernetes Secret 注入密钥：
  #
  # extraEnvs:
  #   - name: PROD_KUBECONFIG
  #     valueFrom:
  #       secretKeyRef:
  #         name: my-cluster-secrets
  #         key: prod-kubeconfig
  #   - name: OAUTH_SECRET
  #     valueFrom:
  #       secretKeyRef:
  #         name: my-oauth-secrets
  #         key: google-client-secret
  #
  # 然后在下面的配置中引用它们：
  # clusters:
  #   - name: production
  #     config: "${PROD_KUBECONFIG}"
  # oauth:
  #   - name: google
  #     clientSecret: "${OAUTH_SECRET}"
  #
  # 集群配置
  # clusters:
  #   - name: production
  #     description: "Production cluster"
  #     config: |
  #       apiVersion: v1
  #       kind: Config
  #       ...
  #     prometheusURL: "http://prometheus:9090"
  #     default: true
  #   - name: in-cluster
  #     inCluster: true
  #
  # OAuth 提供方配置
  # oauth:
  #   - name: google
  #     clientId: "xxx.apps.googleusercontent.com"
  #     clientSecret: "secret-value"
  #     issuer: "https://accounts.google.com"
  #     scopes: "openid,profile,email"
  #     enabled: true
  #
  # LDAP 配置（完整字段列表：docs/config/config-file.md）
  # ldap:
  #   enabled: true
  #   serverUrl: "ldaps://ldap.example.com:636"
  #   useStartTLS: false
  #   bindDn: "cn=svc-aerolink,ou=services,dc=example,dc=com"
  #   bindPassword: "bind-password"
  #   userBaseDn: "ou=users,dc=example,dc=com"
  #   userFilter: "(uid=%s)"
  #   usernameAttribute: "uid"
  #   displayNameAttribute: "cn"
  #   groupBaseDn: "ou=groups,dc=example,dc=com"
  #   groupFilter: "(member=%s)"
  #   groupNameAttribute: "cn"
  #   # 定期同步目录用户（默认启用，每 10 分钟一次）
  #   autoSync: true
  #   syncIntervalMinutes: 10
  #
  # RBAC 配置（角色与角色映射）
  # rbac:
  #   roles:
  #     - name: admin
  #       description: "Full access"
  #       clusters: ["*"]
  #       namespaces: ["*"]
  #       resources: ["*"]
  #       verbs: ["*"]
  #   roleMapping:
  #     - name: admin
  #       users: ["alice"]
  #       oidcGroups: ["admins"]

# 本节用于构建 service account，更多信息见：https://kubernetes.io/docs/concepts/security/service-accounts/
serviceAccount:
  # 指定是否创建 service account
  create: true
  # 是否自动挂载 ServiceAccount 的 API 凭据？
  automount: true
  # 添加到 service account 的 Annotations
  annotations: {}
  # 要使用的 service account 名称。
  # 如果未设置且 create 为 true，则会使用 fullname 模板生成名称
  name: ""

rbac:
  create: true
  rules:
    - apiGroups: ["*"]
      resources: ["*"]
      verbs: ["*"]
    - nonResourceURLs: ["*"]
      verbs: ["*"]

# 用于为 Pod 设置 Kubernetes Annotations。
# 更多信息见：https://kubernetes.io/docs/concepts/overview/working-with-objects/annotations/
podAnnotations: {}
# 用于为 Pod 设置 Kubernetes Labels。
# 更多信息见：https://kubernetes.io/docs/concepts/overview/working-with-objects/labels/
podLabels: {}

podSecurityContext:
  {}
  # fsGroup: 2000

securityContext:
  {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

# 用于配置 service，更多信息见：https://kubernetes.io/docs/concepts/services-networking/service/
service:
  # 设置 service 类型，更多信息见：https://kubernetes.io/docs/concepts/services-networking/service/#publishing-services-service-types
  type: ClusterIP
  # 设置端口，更多信息见：https://kubernetes.io/docs/concepts/services-networking/service/#field-spec-ports
  port: 8080

# 本段用于配置 ingress，更多信息见：https://kubernetes.io/docs/concepts/services-networking/ingress/
ingress:
  enabled: false
  className: "nginx"
  annotations: {}
  hosts:
    - host: aerolink.gogdev.cn
      paths:
        - path: /
          pathType: ImplementationSpecific
  # tls:
  #  - hosts:
  #      - aerolink.gogdev.cn

# 用于对外暴露鸢联 AeroLink 的 Gateway API 资源
# 需要集群中已安装 Gateway API CRD
# 更多信息见：https://gateway-api.sigs.k8s.io/
gateway:
  enabled: false
  # GatewayClass 名称——必须已存在于集群中
  # 示例："istio"、"cilium"、"nginx"、"envoy-gateway"
  className: ""
  # 设为 true 以创建新的 Gateway 资源
  # 设为 false 以使用已有的 Gateway
  create: false
  # Gateway 名称（创建新 Gateway 或引用已有 Gateway 时都会用到）
  name: ""
  # 已有 Gateway 的命名空间（仅在 create 为 false 时使用）
  # 未指定时默认为 release 所在的命名空间
  namespace: ""
  # Gateway 的 Annotations（仅在 create 为 true 时使用）
  annotations: {}
  # Gateway listener 配置（仅在 create 为 true 时使用）
  listeners:
    - name: http
      port: 80
      protocol: HTTP
      # listener 的可选 hostname
      # hostname: "*.example.com"
      allowedRoutes:
        namespaces:
          from: Same
    # 取消注释以添加 HTTPS listener
    # - name: https
    #   port: 443
    #   protocol: HTTPS
    #   hostname: "aerolink.gogdev.cn"
    #   allowedRoutes:
    #     namespaces:
    #       from: Same
    #   tls:
    #     mode: Terminate
    #     certificateRefs:
    #       - name: aerolink-tls-secret
  # HTTPRoute 配置（支持配置多条路由）
  httpRoutes:
    - name: aerolink
      # HTTPRoute 的 Annotations
      annotations: {}
      # 要匹配的 Hostname（可选，留空则匹配所有）
      hostnames: []
        # - aerolink.gogdev.cn
      # 路由规则
      rules:
        - matches:
            - path:
                type: PathPrefix
                value: /
          timeouts:
            request: "120s"
    # 示例：为不同的 hostname/路径添加路由
    # - name: aerolink-api
    #   annotations: {}
    #   hostnames:
    #     - api.example.com
    #   rules:
    #     - matches:
    #         - path:
    #             type: PathPrefix
    #             value: /api

resources:
  {}
  # 我们通常建议不指定默认的 resources，而是把这项决定留给用户
  # 自行斟酌。这样也能提高 chart 在资源较少的环境（如 Minikube）中运行
  # 的成功率。如果你确实想指定 resources，请取消下面几行的注释，
  # 按需调整，并删除 'resources:' 后面的花括号。
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

# 用于配置 liveness 与 readiness 探针，更多信息见：https://kubernetes.io/docs/tasks/configure-pod-container/configure-liveness-readiness-startup-probes/
livenessProbe:
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 10
  periodSeconds: 10
readinessProbe:
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 10
  periodSeconds: 10
# 追加到渲染出的 Deployment 定义上的额外 volumes。
volumes: []
# - name: foo
#   secret:
#     secretName: mysecret
#     optional: false

# 追加到渲染出的 Deployment 定义上的额外 volumeMounts。
volumeMounts: []
# - name: foo
#   mountPath: "/etc/foo"
#   readOnly: true

nodeSelector: {}

tolerations: []

affinity: {}
