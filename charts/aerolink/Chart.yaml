apiVersion: v2
name: aerolink
description: A Helm chart for Kubernetes
icon: https://aerolink.gogdev.cn/logo.svg

# chart 的 type 可以是 'application' 或 'library'。
#
# application 类型的 chart 是一组模板，可以打包成带版本的归档用于部署。
#
# library 类型的 chart 只提供可复用的工具与函数，作为 application chart 的依赖引入，
# 把工具与函数注入渲染流程。library chart 不定义任何模板，因此不能直接部署。
type: application

# chart 版本号。每次修改 chart 或其模板（包括 app 版本）都应递增。
# 版本号遵循语义化版本规范（https://semver.org/）
version: 1.0.7

# 这是部署的应用自身的版本号。每次修改应用都应递增；它不要求遵循
# 语义化版本，反映应用使用的版本即可。建议用引号包裹。
# 形式与 git tag 一致（vX.Y.Z）：chart 默认镜像 tag 取这个值，
# 写成 v 前缀才能对应发布流水线推上来的镜像 tag。
appVersion: "v1.0.7"
