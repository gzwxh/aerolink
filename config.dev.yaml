# 本地开发默认配置（配合 dev.env 使用，见 README「本地开发」）。
#
# 启动方式：
#   make dev     # 后端 + Vite 前端热更新
#   make run     # 仅后端（使用内嵌前端产物）
#
# 敏感值支持 ${ENV_VAR} 占位符，会从环境变量展开，例如：
#   password: ${KITE_DEV_ADMIN_PASSWORD}
#
# ⚠️ 仅供本地开发：这里出现的口令/密钥不要用于任何真实环境。

# 首次启动（数据库为空）时自动创建的管理员账号。
superUser:
  username: admin
  password: AdminPass!234

# 集群配置：
#   - 留空时，启动会尝试导入 ~/.kube/config（或 $KUBECONFIG）中的集群；
#   - 也可以在这里写死一个集群（config 为 kubeconfig 内容）。
# clusters:
#   - name: local
#     description: 本地 kind / minikube
#     default: true
#     config: |
#       apiVersion: v1
#       kind: Config
#       clusters: []
#       contexts: []
#       users: []
#       current-context: ""

# 可选：本地联调外部认证时打开（生产请在界面里配置）。
# ldap:
#   enabled: true
#   serverUrl: ldap://127.0.0.1:3389
#   bindDn: cn=admin,dc=example,dc=org
#   bindPassword: ${KITE_DEV_LDAP_PASSWORD}
#   userBaseDn: ou=users,dc=example,dc=org
#   userFilter: (&(uid=%s)(objectClass=inetOrgPerson))
#   usernameAttribute: uid
#   displayNameAttribute: cn

# 可选：预置自定义角色（界面里也能配）。
# rbac:
#   roles:
#     - name: dev-viewer
#       description: 本地只读
#       clusters: ["*"]
#       namespaces: ["*"]
#       resources: ["pods", "deployments"]
#       verbs: ["get", "list", "watch"]
#   roleMapping:
#     - name: dev-viewer
#       users: ["admin"]

# 可选：日志归档（本地 parquet + 外部存储 S3/ES）。详细方案见
# docs/dev/plans/2026-09-20-audit-log-parquet-archive.md。
# 这里只作为「首次启动播种值」：数据库无归档配置时写入 audit_settings，
# 之后管理员可在「审计设置」页面修改（页面配置优先于本文件）。
auditArchive:
  enabled: false                 # 本地开发默认关闭，按需打开
  localDir: /var/log/kite/archive  # 日志存放位置（空 = 用 KITE_AUDIT_ARCHIVE_DIR）
  retentionDays: 7               # 本地保留天数（存多久），0 = 不清理
  maxBytes: 10737418240          # 本地容量上限（10 GiB），0 = 不清理
  flush:
    intervalSeconds: 120
    maxBatchRows: 100000
    maxBatchBytes: 67108864
  # 访问日志单独滚留阈值（频率远高于审计日志）
  accessLog:
    enabled: true
    retentionDays: 3
    maxBytes: 5368709120         # 5 GiB
    flush:
      intervalSeconds: 120
      maxBatchRows: 200000
      maxBatchBytes: 67108864
  # 外部存储 S3（兼容 MinIO / RustFS / Ceph RGW / 腾讯 COS / 华为 OBS / 阿里 OSS 等）
  s3:
    enabled: false
    endpoint: http://minio:9000          # 各厂商 endpoint 见方案文档 §8.1
    region: ""                           # COS 必填，如 ap-guangzhou
    bucket: kite-audit
    accessKey: ${KITE_S3_ACCESS_KEY}
    secretKey: ${KITE_S3_SECRET_KEY}
    pathStyle: true                      # MinIO/RustFS/Ceph 为 true，COS/OBS 为 false
    useTLS: false
    prefix: kite-audit/
    deleteLocalAfterUpload: true         # 上传成功即删本地（默认）
  # 外部存储 Elasticsearch（检索，非归档）
  elasticsearch:
    enabled: false
    urls: ["http://es:9200"]
    username: ""
    password: ${KITE_ES_PASSWORD}
    indexPrefix: kite-audit
    tlsInsecureSkipVerify: false
