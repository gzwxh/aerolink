apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kite
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
  - kind: ServiceAccount
    name: kite
    namespace: kube-system
---
kind: ServiceAccount
apiVersion: v1
metadata:
  name: kite
  namespace: kube-system
---
# 替换为随机值后再部署（openssl rand -base64 32 生成），并妥善保存：
# 更换 KITE_ENCRYPT_KEY 会使已保存的凭据无法解密，需要重新保存全部凭据。
apiVersion: v1
kind: Secret
metadata:
  name: kite-secret
  namespace: kube-system
type: Opaque
stringData:
  JWT_SECRET: "REPLACE-ME-with-openssl-rand-base64-32-output"
  KITE_ENCRYPT_KEY: "REPLACE-ME-with-openssl-rand-base64-32-output"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: kite
  name: kite
  namespace: kube-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kite
  strategy: {}
  template:
    metadata:
      labels:
        app: kite
    spec:
      serviceAccountName: kite
      containers:
        - image: swr.cn-south-1.myhuaweicloud.com/dsy/devops/kite:latest
          imagePullPolicy: IfNotPresent
          name: kite
          envFrom:
            - secretRef:
                name: kite-secret
          resources:
            limits:
              cpu: 1000m
              memory: 512Mi
            requests:
              cpu: 100m
              memory: 128Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
          ports:
            - containerPort: 8080
              protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app: kite
  name: kite
  namespace: kube-system
spec:
  ports:
    - name: http
      port: 8080
      protocol: TCP
      targetPort: 8080
  selector:
    app: kite
  type: ClusterIP
