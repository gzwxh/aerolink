apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: aerolink
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
  - kind: ServiceAccount
    name: aerolink
    namespace: kube-system
---
kind: ServiceAccount
apiVersion: v1
metadata:
  name: aerolink
  namespace: kube-system
---
# 替换为随机值后再部署（openssl rand -base64 32 生成），并妥善保存：
# 更换 AEROLINK_ENCRYPT_KEY 会使已保存的凭据无法解密，需要重新保存全部凭据。
apiVersion: v1
kind: Secret
metadata:
  name: aerolink-secret
  namespace: kube-system
type: Opaque
stringData:
  JWT_SECRET: "REPLACE-ME-with-openssl-rand-base64-32-output"
  AEROLINK_ENCRYPT_KEY: "REPLACE-ME-with-openssl-rand-base64-32-output"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: aerolink
  name: aerolink
  namespace: kube-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: aerolink
  strategy: {}
  template:
    metadata:
      labels:
        app: aerolink
    spec:
      serviceAccountName: aerolink
      containers:
        - image: swr.cn-south-1.myhuaweicloud.com/gzwxh/devops/aerolink:v1.0.0
          imagePullPolicy: IfNotPresent
          name: aerolink
          envFrom:
            - secretRef:
                name: aerolink-secret
          # 审计日志的落地方式（五选一、互斥，**启动时**生效、页面只读）：
          #   database（默认，不设即可） / parquet / elasticsearch / victorialogs / openobserve
          #   ① parquet：必须同时给归档目录（AEROLINK_AUDIT_ARCHIVE_DIR，或挂 config.yaml 配
          #      auditArchive.localDir），否则会拒绝启动。S3 远端副本可在页面上另配。
          #   ② elasticsearch：ES 地址必须先存在（页面先填好「审计设置 → ES」并保存，或用
          #      config.yaml 的 auditArchive.elasticsearch.urls 播种），否则会拒绝启动。
          #   ③ victorialogs：VictoriaLogs（**不是** VictoriaMetrics）地址必须先存在，同上。
          #   ④ openobserve：OpenObserve 地址必须先存在，同上。
          # 归档与系统日志落盘（可选）：是否归档由上面的 auditSink 决定，
          # 这里的归档目录只作启动兜底；AEROLINK_LOG_FILE 是让 klog 落文件、不再写 stderr。
          # env:
          #   - name: AEROLINK_AUDIT_SINK
          #     value: parquet
          #   - name: AEROLINK_AUDIT_ARCHIVE_DIR
          #     value: /home/aerolink/data/archive
          #   - name: AEROLINK_LOG_FILE
          #     value: /home/aerolink/data/aerolink.log
          # volumeMounts:
          #   - name: aerolink-logs
          #     mountPath: /home/aerolink/data
          resources:
            limits:
              cpu: 1000m
              memory: 512Mi
            requests:
              cpu: 100m
              memory: 128Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
          ports:
            - containerPort: 8080
              protocol: TCP
          # 与上面的 volumeMounts 配套。emptyDir 只在 Pod 生命周期内保留，
          # 归档与日志要跨重建保留时请换成 PVC。
          # volumes:
          #   - name: aerolink-logs
          #     emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app: aerolink
  name: aerolink
  namespace: kube-system
spec:
  ports:
    - name: http
      port: 8080
      protocol: TCP
      targetPort: 8080
  selector:
    app: aerolink
  type: ClusterIP
