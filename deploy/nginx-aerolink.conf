# 鸢联 AeroLink 多副本入口（宿主机 nginx）
#
# 拓扑：nginx(8080) → 3 个本机副本(8081/8082/8083) → PostgreSQL(aerolink-postgres12)。
# 副本是无状态的：会话、登录失败计数、待验证票据、设置缓存都在 PostgreSQL 里，
# 所以**不需要粘性会话**，轮询即可（见 docs/dev/plans/2026-09-20-多副本部署.md）。
#
# 安装：
#   cp deploy/nginx-aerolink.conf /etc/nginx/conf.d/aerolink.conf
#   nginx -t && systemctl reload nginx
# 副本端口要和 systemd 实例号对齐：
#   systemctl enable --now aerolink@8081 aerolink@8082 aerolink@8083

# WebSocket（容器终端、日志跟随）需要按 Upgrade 头切换协议。
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream aerolink_backend {
    # 副本挂了就自动摘掉，10 秒后再试；keepalive 减少重复握手。
    server 127.0.0.1:8081 max_fails=3 fail_timeout=10s;
    server 127.0.0.1:8082 max_fails=3 fail_timeout=10s;
    server 127.0.0.1:8083 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

server {
    listen 8080;
    server_name _;

    # 容器文件上传走同一个入口，与后端 maxUploadSize（512MiB）保持一致。
    client_max_body_size 512m;

    location / {
        proxy_pass http://aerolink_backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;

        # 终端/日志是长连接，别让 nginx 先超时掐断。
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        # AI 对话是 SSE 流式返回，缓冲会让内容卡住不出。
        proxy_buffering off;
        proxy_request_buffering off;
    }
}
