<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400"
     role="img" aria-labelledby="bannerTitle bannerDesc">
  <title id="bannerTitle">电商云 · E-Commerce Cloud</title>
  <desc id="bannerDesc">蓝色渐变天空背景，云端服务节点、漂浮云朵、无人机、购物袋、商品卡片、包裹与金币等电商元素组成的动态横幅</desc>

  <defs>
    <!-- ============ 背景渐变 ============ -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#123F9E"/>
      <stop offset="42%"  stop-color="#2769E0"/>
      <stop offset="74%"  stop-color="#4FA3EE"/>
      <stop offset="100%" stop-color="#9ADEF8"/>
    </linearGradient>

    <radialGradient id="glowWarm">
      <stop offset="0%"   stop-color="#FFFFFF" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowCyan">
      <stop offset="0%"   stop-color="#7CF3E4" stop-opacity="0.42"/>
      <stop offset="100%" stop-color="#7CF3E4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowAmber">
      <stop offset="0%"   stop-color="#FFD27A" stop-opacity="0.40"/>
      <stop offset="100%" stop-color="#FFD27A" stop-opacity="0"/>
    </radialGradient>

    <!-- 数据网格 -->
    <pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M64 0H0V64" fill="none" stroke="#FFFFFF" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>

    <!-- 云体 -->
    <linearGradient id="cloudGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#FFFFFF"/>
      <stop offset="70%"  stop-color="#F2F9FF"/>
      <stop offset="100%" stop-color="#D5E9FB"/>
    </linearGradient>

    <!-- 服务节点配色 -->
    <linearGradient id="nodeBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5CC8FB"/><stop offset="100%" stop-color="#1565C0"/>
    </linearGradient>
    <linearGradient id="nodeOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFB74D"/><stop offset="100%" stop-color="#E65100"/>
    </linearGradient>
    <linearGradient id="nodeGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7BE495"/><stop offset="100%" stop-color="#1B8043"/>
    </linearGradient>

    <!-- 电商元素配色 -->
    <linearGradient id="bagGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF8A65"/><stop offset="100%" stop-color="#D84315"/>
    </linearGradient>
    <linearGradient id="boxTop" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFE082"/><stop offset="100%" stop-color="#FFD24C"/>
    </linearGradient>
    <linearGradient id="boxLeft" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E7A93A"/><stop offset="100%" stop-color="#C9861F"/>
    </linearGradient>
    <linearGradient id="boxRight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F0BC55"/><stop offset="100%" stop-color="#D69528"/>
    </linearGradient>
    <linearGradient id="coinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE066"/><stop offset="100%" stop-color="#F0A500"/>
    </linearGradient>

    <!-- 滤镜 -->
    <filter id="softShadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0A2F63" flood-opacity="0.30"/>
    </filter>
    <filter id="softShadowSm" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#0A2F63" flood-opacity="0.32"/>
    </filter>
    <filter id="textShadow" x="-20%" y="-40%" width="140%" height="200%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#062B63" flood-opacity="0.42"/>
    </filter>

    <!-- 画布圆角裁剪 -->
    <clipPath id="roundedClip">
      <rect width="1200" height="400" rx="24" ry="24"/>
    </clipPath>

    <!-- ============ 复用图形 ============ -->
    <g id="cloudShape">
      <ellipse cx="0"   cy="0"   rx="52" ry="32"/>
      <ellipse cx="-44" cy="10"  rx="34" ry="22"/>
      <ellipse cx="46"  cy="8"   rx="38" ry="24"/>
      <ellipse cx="2"   cy="-22" rx="36" ry="24"/>
    </g>

    <!-- 包裹盒（等距，中心在原点） -->
    <g id="parcelShape">
      <path d="M-28,-30 L0,-45 L28,-30 L0,-15 Z" fill="url(#boxTop)"/>
      <path d="M-28,-30 L0,-15 L0,27 L-28,12 Z" fill="url(#boxLeft)"/>
      <path d="M28,-30 L0,-15 L0,27 L28,12 Z" fill="url(#boxRight)"/>
      <path d="M0,-45 L0,-15 M-28,-30 L28,-30" fill="none" stroke="#FFF6DC" stroke-opacity="0.75" stroke-width="3"/>
      <path d="M-28,-30 L0,-15 L28,-30" fill="none" stroke="#8A5A10" stroke-opacity="0.25" stroke-width="1.4"/>
    </g>

    <!-- 金币 -->
    <g id="coinShape">
      <circle r="15" fill="url(#coinGrad)" stroke="#D99700" stroke-width="2"/>
      <circle r="10" fill="none" stroke="#FFF6CC" stroke-opacity="0.9" stroke-width="2"/>
      <text y="6" text-anchor="middle" font-size="17" font-weight="700"
            font-family="'PingFang SC','Microsoft YaHei',sans-serif" fill="#A86B00">¥</text>
    </g>

    <!-- 流动轨道（供 animateMotion 引用） -->
    <path id="flowPath" d="M796,186 C 846,132 892,124 926,158 C 962,192 1000,196 1036,190"
          fill="none" stroke="none"/>
  </defs>

  <g clip-path="url(#roundedClip)">

    <!-- ================= 背景 ================= -->
    <rect width="1200" height="400" fill="url(#bgGrad)"/>
    <circle cx="1030" cy="30"  r="280" fill="url(#glowWarm)"/>
    <circle cx="150"  cy="400" r="250" fill="url(#glowCyan)"/>
    <circle cx="620"  cy="330" r="190" fill="url(#glowAmber)"/>
    <rect width="1200" height="400" fill="url(#grid)"/>

    <!-- 底部云海（两层） -->
    <path d="M0 326 C 180 288 360 354 560 328 C 760 302 940 354 1200 320 L1200 400 L0 400 Z"
          fill="#FFFFFF" fill-opacity="0.13"/>
    <path d="M0 358 C 200 322 420 386 640 356 C 860 326 1010 376 1200 346 L1200 400 L0 400 Z"
          fill="#FFFFFF" fill-opacity="0.20"/>

    <!-- ================= 漂移云朵 ================= -->
    <g>
      <animateTransform attributeName="transform" type="translate"
                        values="-280 0; 1480 0" dur="68s" repeatCount="indefinite"/>
      <use href="#cloudShape" transform="translate(140,70) scale(0.85)" fill="url(#cloudGrad)" opacity="0.92"/>
    </g>
    <g>
      <animateTransform attributeName="transform" type="translate"
                        values="-420 0; 1480 0" dur="96s" begin="-30s" repeatCount="indefinite"/>
      <use href="#cloudShape" transform="translate(560,42) scale(0.58)" fill="url(#cloudGrad)" opacity="0.66"/>
    </g>
    <g>
      <animateTransform attributeName="transform" type="translate"
                        values="-360 0; 1480 0" dur="82s" begin="-52s" repeatCount="indefinite"/>
      <use href="#cloudShape" transform="translate(900,96) scale(0.72)" fill="url(#cloudGrad)" opacity="0.55"/>
    </g>
    <g>
      <animateTransform attributeName="transform" type="translate"
                        values="-300 0; 1480 0" dur="110s" begin="-18s" repeatCount="indefinite"/>
      <use href="#cloudShape" transform="translate(1120,52) scale(0.48)" fill="url(#cloudGrad)" opacity="0.5"/>
    </g>

    <!-- ================= 星点闪烁 ================= -->
    <g fill="#FFFFFF">
      <circle cx="470" cy="66" r="2.6">
        <animate attributeName="opacity" values="0.2;0.95;0.2" dur="2.8s" repeatCount="indefinite"/>
      </circle>
      <circle cx="612" cy="128" r="2">
        <animate attributeName="opacity" values="0.15;0.9;0.15" dur="3.4s" begin="0.8s" repeatCount="indefinite"/>
      </circle>
      <circle cx="1092" cy="66" r="2.4">
        <animate attributeName="opacity" values="0.2;1;0.2" dur="2.2s" begin="0.4s" repeatCount="indefinite"/>
      </circle>
      <circle cx="686" cy="230" r="1.8">
        <animate attributeName="opacity" values="0.15;0.85;0.15" dur="3.9s" begin="1.2s" repeatCount="indefinite"/>
      </circle>
      <circle cx="1160" cy="238" r="2.2">
        <animate attributeName="opacity" values="0.2;0.9;0.2" dur="3.1s" begin="1.6s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- ================= 左侧文案 ================= -->
    <g filter="url(#textShadow)">
      <text x="84" y="204" font-size="72" font-weight="700" fill="#FFFFFF" letter-spacing="6"
            font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',system-ui,sans-serif">电商云</text>
    </g>
    <text x="88" y="242" font-size="17" font-weight="600" fill="#FFFFFF" fill-opacity="0.86" letter-spacing="7"
          font-family="'Helvetica Neue',Arial,system-ui,sans-serif">E-COMMERCE CLOUD</text>
    <text x="89" y="276" font-size="18" fill="#FFFFFF" fill-opacity="0.78" letter-spacing="1.5"
          font-family="'PingFang SC','Microsoft YaHei',system-ui,sans-serif">云原生 · 全链路 · 智能电商平台</text>

    <!-- 标签胶囊 -->
    <g font-family="'PingFang SC','Microsoft YaHei',system-ui,sans-serif" font-size="13.5" fill="#FFFFFF">
      <g>
        <rect x="88" y="298" width="88" height="32" rx="16" fill="#FFFFFF" fill-opacity="0.16"
              stroke="#FFFFFF" stroke-opacity="0.38"/>
        <text x="132" y="319" text-anchor="middle">弹性扩容</text>
      </g>
      <g>
        <rect x="188" y="298" width="88" height="32" rx="16" fill="#FFFFFF" fill-opacity="0.16"
              stroke="#FFFFFF" stroke-opacity="0.38"/>
        <text x="232" y="319" text-anchor="middle">高可用</text>
      </g>
      <g>
        <rect x="288" y="298" width="88" height="32" rx="16" fill="#FFFFFF" fill-opacity="0.16"
              stroke="#FFFFFF" stroke-opacity="0.38"/>
        <text x="332" y="319" text-anchor="middle">全链路</text>
      </g>
    </g>

    <!-- ================= 右侧主视觉：云 + 服务节点 ================= -->
    <!-- 大云底座 -->
    <use href="#cloudShape" transform="translate(890,200) scale(1.8)" fill="url(#cloudGrad)"
         opacity="0.96" filter="url(#softShadow)">
      <animateTransform attributeName="transform" type="translate" values="0 0; 0 -10; 0 0"
                        dur="7s" repeatCount="indefinite" additive="sum"/>
    </use>

    <!-- 节点互联虚线 -->
    <g fill="none" stroke="#FFFFFF" stroke-opacity="0.4" stroke-width="2" stroke-dasharray="7 7"
       stroke-linecap="round">
      <path d="M812,168 C 850,132 882,126 900,144"/>
      <path d="M950,146 C 976,152 998,166 1018,178"/>
    </g>

    <!-- 流动数据光点 -->
    <g>
      <circle r="4.5" fill="#FFE082" filter="url(#softShadowSm)">
        <animateMotion dur="3.6s" repeatCount="indefinite" rotate="0">
          <mpath href="#flowPath"/>
        </animateMotion>
      </circle>
      <circle r="3.5" fill="#A7F3E0">
        <animateMotion dur="3.6s" begin="1.8s" repeatCount="indefinite" rotate="0">
          <mpath href="#flowPath"/>
        </animateMotion>
      </circle>
    </g>

    <!-- 节点 A：闪电（算力） -->
    <g transform="translate(800,166)">
      <animateTransform attributeName="transform" type="translate" values="0 0; 0 -9; 0 0"
                        dur="3.6s" repeatCount="indefinite" additive="sum"/>
      <rect x="-33" y="-33" width="66" height="66" rx="18" fill="url(#nodeBlue)" filter="url(#softShadowSm)"/>
      <path d="M4,-19 L-11,2 h9 l-4,17 L14,-4 h-9 z" fill="#FFFFFF"/>
    </g>

    <!-- 节点 B：购物车（交易） -->
    <g transform="translate(920,142)">
      <animateTransform attributeName="transform" type="translate" values="0 0; 0 -12; 0 0"
                        dur="4.4s" repeatCount="indefinite" additive="sum"/>
      <rect x="-33" y="-33" width="66" height="66" rx="18" fill="url(#nodeOrange)" filter="url(#softShadowSm)"/>
      <path d="M-18,-14 h6 l8,21 h21 l6,-15 h-30" fill="none" stroke="#FFFFFF" stroke-width="3.2"
            stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="0" cy="16" r="3.2" fill="#FFFFFF"/>
      <circle cx="15" cy="16" r="3.2" fill="#FFFFFF"/>
    </g>

    <!-- 节点 C：立方体（订单/库存） -->
    <g transform="translate(1032,176)">
      <animateTransform attributeName="transform" type="translate" values="0 0; 0 -10; 0 0"
                        dur="4s" begin="-1.2s" repeatCount="indefinite" additive="sum"/>
      <rect x="-33" y="-33" width="66" height="66" rx="18" fill="url(#nodeGreen)" filter="url(#softShadowSm)"/>
      <path d="M0,-17 L15,-9 L15,8 L0,16 L-15,8 L-15,-9 Z" fill="none" stroke="#FFFFFF" stroke-width="2.8"
            stroke-linejoin="round"/>
      <path d="M-15,-9 L0,-1 L15,-9 M0,-1 L0,16" fill="none" stroke="#FFFFFF" stroke-width="2.8"
            stroke-linejoin="round"/>
    </g>

    <!-- ================= 电商元素 ================= -->
    <!-- 商品卡片（漂浮） -->
    <g transform="translate(676,300)">
      <animateTransform attributeName="transform" type="translate" values="0 0; 0 -12; 0 0"
                        dur="5.2s" repeatCount="indefinite" additive="sum"/>
      <g transform="rotate(-7)">
        <rect x="-50" y="-35" width="100" height="70" rx="11" fill="#FFFFFF" filter="url(#softShadow)"/>
        <rect x="-40" y="-25" width="36" height="36" rx="7" fill="#D7ECFF"/>
        <circle cx="-22" cy="-7" r="7" fill="#7FC4FF"/>
        <path d="M-40,11 l11,-9 9,7 8,-6 12,11 z" fill="#B6DEFF"/>
        <rect x="2" y="-23" width="38" height="7" rx="3.5" fill="#DCE9F7"/>
        <rect x="2" y="-10" width="27" height="7" rx="3.5" fill="#EAF3FC"/>
        <rect x="2" y="4" width="22" height="13" rx="6.5" fill="#FF8A3D"/>
        <path d="M8,10.5 h10" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
      </g>
    </g>

    <!-- 购物袋 -->
    <g transform="translate(1082,300)">
      <animateTransform attributeName="transform" type="translate" values="0 0; 0 -14; 0 0"
                        dur="4.8s" begin="-1.6s" repeatCount="indefinite" additive="sum"/>
      <g filter="url(#softShadow)">
        <path d="M-18,-16 v-7 a18,18 0 0 1 36,0 v7" fill="none" stroke="#B23A0C" stroke-width="6"
              stroke-linecap="round"/>
        <path d="M-42,-16 H42 L33,54 H-33 Z" fill="url(#bagGrad)"/>
        <path d="M-42,-16 H42 L41,-6 H-41 Z" fill="#8E2F0B" fill-opacity="0.28"/>
        <circle cx="0" cy="18" r="11" fill="#FFFFFF" fill-opacity="0.42"/>
        <path d="M-5,18 h10 M0,13 v10" stroke="#FFFFFF" stroke-opacity="0.95" stroke-width="3.4"
              stroke-linecap="round"/>
      </g>
    </g>

    <!-- 漂浮包裹 -->
    <g transform="translate(628,80)">
      <animateTransform attributeName="transform" type="translate" values="0 0; 0 -16; 0 0"
                        dur="4.2s" repeatCount="indefinite" additive="sum"/>
      <g>
        <animateTransform attributeName="transform" type="rotate" values="-9; 9; -9"
                          dur="4.2s" repeatCount="indefinite"/>
        <use href="#parcelShape" transform="scale(0.95)" filter="url(#softShadowSm)"/>
      </g>
    </g>

    <!-- 金币（翻转） -->
    <g transform="translate(1088,92)">
      <animateTransform attributeName="transform" type="translate" values="0 0; 0 -9; 0 0"
                        dur="3.2s" repeatCount="indefinite" additive="sum"/>
      <use href="#coinShape" filter="url(#softShadowSm)">
        <animateTransform attributeName="transform" type="scale" values="1 1; 0.16 1; 1 1"
                          dur="3s" repeatCount="indefinite"/>
      </use>
    </g>
    <g transform="translate(1150,168)">
      <animateTransform attributeName="transform" type="translate" values="0 0; 0 -7; 0 0"
                        dur="2.6s" begin="-0.9s" repeatCount="indefinite" additive="sum"/>
      <g transform="scale(0.72)">
        <use href="#coinShape" filter="url(#softShadowSm)">
          <animateTransform attributeName="transform" type="scale" values="1 1; 0.16 1; 1 1"
                            dur="2.4s" begin="-1.1s" repeatCount="indefinite"/>
        </use>
      </g>
    </g>
    <g transform="translate(508,262)">
      <g transform="scale(0.55)">
        <use href="#coinShape" opacity="0.85">
          <animateTransform attributeName="transform" type="scale" values="1 1; 0.18 1; 1 1"
                            dur="2.8s" begin="-0.6s" repeatCount="indefinite"/>
        </use>
      </g>
    </g>

    <!-- 无人机（吊运包裹） -->
    <g>
      <animateTransform attributeName="transform" type="translate" values="1230 0; 620 0"
                        dur="21s" repeatCount="indefinite"/>
      <g transform="translate(0,78)">
        <animateTransform attributeName="transform" type="translate" values="0 0; 0 -12; 0 0"
                          dur="2.6s" repeatCount="indefinite" additive="sum"/>
        <g transform="rotate(-4)">
          <!-- 机身 -->
          <rect x="-24" y="-4" width="48" height="11" rx="5.5" fill="#37474F"/>
          <circle cy="1" r="6" fill="#FF7043"/>
          <path d="M-20,-2 L-27,-10 M20,-2 L27,-10" stroke="#546E7A" stroke-width="2.4" stroke-linecap="round"/>
          <!-- 旋翼 -->
          <ellipse cx="-28" cy="-11" rx="13" ry="3" fill="#B0BEC5" fill-opacity="0.9">
            <animate attributeName="rx" values="13;3;13" dur="0.22s" repeatCount="indefinite"/>
          </ellipse>
          <ellipse cx="28" cy="-11" rx="13" ry="3" fill="#B0BEC5" fill-opacity="0.9">
            <animate attributeName="rx" values="13;3;13" dur="0.19s" repeatCount="indefinite"/>
          </ellipse>
          <!-- 吊索与货箱 -->
          <path d="M-8,7 v9 M8,7 v9" stroke="#546E7A" stroke-width="1.8"/>
          <rect x="-13" y="16" width="26" height="20" rx="3.5" fill="#FFCA28"/>
          <path d="M0,16 v20" stroke="#FFF3D6" stroke-opacity="0.85" stroke-width="2.4"/>
        </g>
      </g>
    </g>

  </g>
</svg>
